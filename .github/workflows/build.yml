name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid: [win-x64, linux-x64, osx-x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish
        run: dotnet publish src/SquadronScramble/SquadronScramble.csproj -c Release -r ${{ matrix.rid }} --self-contained -o publish/SquadronScramble-${{ matrix.rid }}
      - uses: actions/upload-artifact@v4
        with:
          name: SquadronScramble-${{ matrix.rid }}
          path: publish/SquadronScramble-${{ matrix.rid }}
